[package]
name = "social-video-editor"
version = "0.1.0"
description = "Editor de vídeo local da Social Nexus"
authors = ["Social Nexus"]
edition = "2021"

[lib]
name = "social_video_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
